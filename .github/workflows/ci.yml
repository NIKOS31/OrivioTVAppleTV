name: tvOS baseline

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tvos-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Device and simulator builds
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: '2.46.0'
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          tools_dir="$RUNNER_TEMP/orivio-xcodegen"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$tools_dir"
          binary=$(find "$tools_dir" -type f -path '*/bin/xcodegen' -print)
          if [[ -z "$binary" || "$binary" == *$'\n'* ]]; then
            echo 'Expected one XcodeGen binary in the verified archive.' >&2
            exit 1
          fi
          chmod +x "$binary"
          "$binary" --version
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Generate and build tvOS targets
        shell: bash
        run: bash scripts/ci/build-tvos.sh

      - name: Test nTV navigation on the simulator
        shell: bash
        run: bash scripts/ci/test-ntv-ui.sh

      - name: Package unsigned nTV for installation
        shell: bash
        run: bash scripts/ci/package-ntv.sh

      - name: Upload unsigned nTV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ntv-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci/packages/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tvos-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/ci/logs/
            build/ci/results/
            build/ci/build-info.json
            build/ci/screenshots/
            build/ci/ffmpeg/provenance.json
            build/ci/ffmpeg/signature-status.txt
            build/ci/ffmpeg/*/objects/ffbuild/config.log
          if-no-files-found: warn
          retention-days: 7
