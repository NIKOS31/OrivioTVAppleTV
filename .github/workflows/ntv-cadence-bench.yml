name: nTV cadence benchmark 56 vs 57

# Benchmark-only, outside the qualification manifest: never packages an app.
on:
  push:
    branches:
      - 'perf/ntv-cadence-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ntv-cadence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: Cadence 56 vs 57 (simulator)
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      XCODEGEN_VERSION: '2.46.0'
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check public source for new credentials
        shell: bash
        run: bash scripts/ci/check-secrets.sh

      - name: Install pinned XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          tools_dir="$RUNNER_TEMP/orivio-xcodegen"
          curl --fail --location --retry 3 \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip" \
            --output "$archive"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$archive" | shasum -a 256 --check
          unzip -q "$archive" -d "$tools_dir"
          binary=$(find "$tools_dir" -type f -path '*/bin/xcodegen' -print)
          if [[ -z "$binary" || "$binary" == *$'\n'* ]]; then
            echo 'Expected one XcodeGen binary in the verified archive.' >&2
            exit 1
          fi
          chmod +x "$binary"
          "$binary" --version
          dirname "$binary" >> "$GITHUB_PATH"

      - name: Build 56 and 57 and run the cadence benchmark
        shell: bash
        env:
          # Cadence rounds already measured in runs 45706101762 and 45787463571.
          BENCH_MODE: profile
        run: bash bench/cadence/run.sh

      - name: Upload benchmark results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ntv-cadence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/bench/summary.json
            build/bench/attachments/
            build/bench/logs/
            build/bench/profiles/
          if-no-files-found: warn
          retention-days: 7
